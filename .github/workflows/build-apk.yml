name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.8.2)"
        required: false
        default: "v1.8.2"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_STORE_FILE: ../../../keystore/black94-release.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Fix NDK gold linker
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ln -sf ld.lld "$NDK_BIN/ld.gold"
          echo "Linked ld.gold to ld.lld"

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/black94-release.jks
          ls -la keystore/

      - name: Install npm dependencies
        run: cd mobile && npm install --legacy-peer-deps

      - name: Build Release APK
        run: cd mobile/android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: List APK output
        run: find mobile/android/app/build/outputs/apk/ -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v1.8.2' }}
          name: "Black94 Real ${{ github.event.inputs.tag || 'v1.8.2' }}"
          body: "Signed Release APK built with JDK 21, NDK 27, CMake"
          files: mobile/android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
