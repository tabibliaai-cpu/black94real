name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.8.2)'
        required: false
        default: '1.8.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Create keystore directory
        run: mkdir -p keystore

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/black94-release.jks

      - name: Build Release APK
        working-directory: mobile/android
        env:
          RELEASE_STORE_FILE: ../../keystore/black94-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: List APK output
        run: |
          find mobile/android/app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: black94-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: black94-release-apk
          path: ./apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: "Black94 v${{ github.event.inputs.version || '1.8.2' }} Release"
          body: |
            ## Black94 Android App (React Native)

            - **Version**: ${{ github.event.inputs.version || '1.8.2' }}
            - **Build**: Release (signed)
            - **Package**: com.black94.app

            ### Changes
            - Design overhaul matching web app theme (monochrome white/black)
            - Ionicons replacing all emoji text icons
            - Bottom nav: Home, Search, Chat, Alerts, Stories
            - White chat bubbles, glass-effect cards, clean auth screen
            - 38 screens, 15 components
          files: ./apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
